name: Feature Request
description: Suggest a new feature for Esquire Admissibility
title: "[FEATURE] "
labels: ["feature", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like
      placeholder: I'd like to see...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other solutions you've considered
      placeholder: I also thought about...
    validations:
      required: false

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Specific scenarios where this would be useful
      placeholder: |
        1. When verifying legal evidence...
        2. For chain of custody tracking...
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Esquire Admissibility does this affect?
      options:
        - "Core evidence verification"
        - "Admissibility scoring"
        - "Chain of custody"
        - "CLI interface"
        - "Documentation"
        - "Testing infrastructure"
        - "Other"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This feature aligns with Esquire Admissibility's scope (legal evidence)
          required: true
        - label: I'm willing to implement this or help with implementation
          required: false
        - label: This doesn't introduce breaking changes without version bump
          required: true