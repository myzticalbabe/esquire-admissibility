name: ci

# The README promises a verdict table and four documented ways to break it.
# This workflow keeps that promise executable: the suite must pass, the three
# examples must be READY at exit 0, and the four break-it cases must still
# break at their documented exit codes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: suite
        run: python -m pytest -q -p no:cacheprovider

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: three postures are READY at exit 0
        run: |
          set -euo pipefail
          for f in examples/civil.json examples/criminal.json examples/administrative.json; do
            python esquire_admissibility.py "$f" | tee /dev/stderr | head -1 | grep -q READY
          done
      - name: the README's break-it cases still break
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          base = json.loads(Path("examples/civil.json").read_text(encoding="utf-8"))
          criminal_base = json.loads(
              Path("examples/criminal.json").read_text(encoding="utf-8")
          )
          admin_base = json.loads(
              Path("examples/administrative.json").read_text(encoding="utf-8")
          )

          cases = []
          r = json.loads(json.dumps(base))
          r["review"]["authority_to_change"] = False
          cases.append(["GAP", "no authority to change the output", r, 1])
          r = json.loads(json.dumps(base))
          del r["witness"]
          cases.append(["INCOMPLETE", "no witness", r, 1])
          r = json.loads(json.dumps(criminal_base))
          r["confrontation"]["surrogate_analyst"] = True
          cases.append(["GAP", "surrogate analyst", r, 1])
          r = json.loads(json.dumps(admin_base))
          r["administrative"]["disclosed_to_opposing_party"] = False
          cases.append(["GAP", "undisclosed output", r, 1])

          for letter, label, record, expected in cases:
              with tempfile.NamedTemporaryFile(
                  "w", suffix=".json", delete=False, encoding="utf-8"
              ) as fh:
                  json.dump(record, fh)
                  path = fh.name
              proc = subprocess.run(
                  [sys.executable, "esquire_admissibility.py", path],
                  capture_output=True,
                  text=True,
              )
              verdict = proc.stdout.splitlines()[0] if proc.stdout else ""
              print(f"break {letter}: returned {proc.returncode} saw {verdict!r}")
              assert proc.returncode == expected, (label, proc.returncode, expected)
              assert "READY" not in verdict, label

          print("break_it: 4 documented breaks still break")
          PY
